repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check src/ tests/
        language: system
        pass_filenames: false
      - id: ruff-format
        name: ruff format check
        entry: uv run ruff format --check src/ tests/
        language: system
        pass_filenames: false
      - id: mypy
        name: mypy strict
        entry: uv run mypy src/
        language: system
        pass_filenames: false
      - id: pytest
        name: pytest coverage gate
        entry: uv run pytest --cov=india_ate --cov-fail-under=95 -q
        language: system
        pass_filenames: false
