$kind: http-request
order: 5000
method: GET
url: '{{baseUrl}}/v1/nearby/{{postalCode}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |
      pm.test("status is 200", function () {
        pm.response.to.have.status(200);
      });
      pm.test("returns verified nearby options for postal code", function () {
        const json = pm.response.json();
        pm.expect(json.postal_code).to.eql("560034");
        pm.expect(json.options).to.be.an("array");
      });
