$kind: http-request
order: 9000
method: POST
url: '{{baseUrl}}/v1/grievance'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "fssai_id": "{{fssaiId}}",
      "issue_category": "spoiled_food",
      "description": "Attempted unauthenticated persistence.",
      "incident_date": "2026-11-26",
      "persist": true
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |
      pm.test("status is 403 when persistence is disabled", function () {
        pm.response.to.have.status(403);
      });
      pm.test("returns a clear disabled-persistence message", function () {
        const json = pm.response.json();
        pm.expect(json.error).to.include("--allow-grievance-persist");
      });
