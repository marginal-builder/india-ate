$kind: http-request
order: 7000
method: GET
url: '{{baseUrl}}/v1/food/{{foodItemId}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |
      pm.test("status is 200", function () {
        pm.response.to.have.status(200);
      });
      pm.test("decodes URL-encoded URI and returns item + standards", function () {
        const json = pm.response.json();
        pm.expect(json.item.item_id).to.eql("item:in:ifct:A001");
        pm.expect(json.standards).to.be.an("array").and.not.be.empty;
      });
