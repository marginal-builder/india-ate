name: Feature request
description: Propose a capability, adapter, or data-model improvement.
title: "[feat]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user or maintainer problem does this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: Describe the smallest useful change and any source/provenance implications.
    validations:
      required: true
  - type: checkboxes
    id: data-rules
    attributes:
      label: Data integrity
      options:
        - label: This proposal does not depend on fabricated FSSAI IDs, names, statuses, or nutrition values.
          required: true
        - label: Any new data source will have a real source URL and content hash.
          required: true
